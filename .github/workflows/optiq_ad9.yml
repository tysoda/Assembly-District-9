name: Civiq AD9 + D1 snapshot

on:
  schedule:
    - cron: "17 14 * * *"        # daily, ~7:17am PT
    - cron: "17 */3 3-10 11 *"   # every 3 hours, Nov 3-10 (election week)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optiq-ad9
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: District and county feeds (AD9, D1)
        run: python scripts/optiq_snapshot.py

      - name: Install precinct dependencies
        run: pip install pandas mapbox-vector-tile shapely pyshp

      - name: Precincts, statewide → AD9 and D1 (map tiles)
        # Separate step so a tile problem never blocks the feed snapshots above.
        # Checks precinct sums against Civiq's county totals and writes nothing that doesn't match.
        continue-on-error: true
        run: python scripts/civiq_precincts.py

      - name: Commit snapshot
        run: |
          git config user.name "optiq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/optiq_ad9 data/optiq_d1 data/optiq_county
          for d in data/civiq data/boundaries; do
            if [ -d "$d" ]; then git add "$d"; fi
          done
          git commit -m "Civiq AD9/D1 snapshot $(date -u +%Y-%m-%dT%H%MZ)" || echo "no changes"
          git pull --rebase
          git push
