name: Optiq AD9 snapshot

on:
  schedule:
    - cron: "17 14 * * *"        # daily, ~7:17am PT
    - cron: "17 */3 3-10 11 *"   # every 3 hours, Nov 3-10 (election week)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optiq-ad9
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Take snapshot
        run: python scripts/optiq_snapshot.py

      - name: Commit snapshot
        run: |
          git config user.name "optiq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/optiq_ad9
          git commit -m "Optiq AD9 snapshot $(date -u +%Y-%m-%dT%H%MZ)" || echo "no changes"
          git pull --rebase
          git push
